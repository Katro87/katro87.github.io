<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masood Ahmad · software & e‑commerce</title>
  <!-- Tailwind + Framer Motion via CDN (static runtime) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Framer Motion is a React library – we use a lightweight CSS + minimal React for the same feel -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap');
    * { font-family: 'Inter', system-ui, sans-serif; scroll-behavior: smooth; }
    body { background: #0F172A; color: #f1f5f9; }
    .bg-card { background: #111827; }
    .primary { color: #4F46E5; }
    .border-glow { box-shadow: 0 8px 20px -6px rgba(79, 70, 229, 0.2); }
    /* fade-in / slide-up animations (pure CSS) */
    .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.7s ease, transform 0.7s ease; }
    .reveal.active { opacity: 1; transform: translateY(0); }
    .hover-lift:hover { transform: translateY(-6px); box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.3); }
    .timeline-card { transition: all 0.2s; }
    .timeline-card:hover { background: #1e293b; border-left: 4px solid #9333EA; transform: scale(1.01); }
    /* mobile menu (hidden by default) */
    #mobile-menu { transition: max-height 0.3s ease-out; max-height: 0; overflow: hidden; }
    #mobile-menu.open { max-height: 400px; }
    @media (min-width: 768px) { #mobile-menu { max-height: 0 !important; } }
  </style>
</head>
<body class="antialiased leading-relaxed">
<div id="root"></div>

<!-- using React 18 + direct JSX for static single‑file portfolio (no build, but runs via Babel standalone) -->
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Icons from Lucide (simple, clean) -->
<script src="https://unpkg.com/lucide@latest"></script>

<!-- Framer Motion is not trivial in static; we mimic with CSS + data‑attributes. but we can use a tiny reveal on scroll -->
<script>
  // reveal on scroll (Intersection Observer)
  document.addEventListener('DOMContentLoaded', function() {
    const reveals = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('active');
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });
    reveals.forEach(el => observer.observe(el));
  });
</script>

<!-- React component (JSX) -->
<script type="text/babel">
  // constants
  const EMAIL = 'masoodkhalid3198@gmail.com';
  const PHONE = '03286465899';
  const LOCATION = 'Lahore, Pakistan';
  
  const NavBar = () => {
    const [menuOpen, setMenuOpen] = React.useState(false);
    const links = ['Home', 'About', 'Experience', 'Projects', 'Skills', 'Education', 'Contact'];
    
    return (
      <nav className="fixed top-0 w-full bg-[#0F172A]/90 backdrop-blur-sm border-b border-gray-800 z-50 shadow-lg">
        <div className="max-w-6xl mx-auto px-6 py-3 flex items-center justify-between">
          <span className="text-2xl font-bold bg-gradient-to-r from-[#4F46E5] to-[#9333EA] bg-clip-text text-transparent">MA</span>
          <div className="hidden md:flex space-x-8 text-sm font-medium text-gray-300">
            {links.map(link => <a key={link} href={`#${link.toLowerCase()}`} className="hover:text-white transition">{link}</a>)}
          </div>
          <button className="md:hidden text-gray-300" onClick={() => setMenuOpen(!menuOpen)}>
            {menuOpen ? '✕' : '☰'}
          </button>
        </div>
        {/* mobile menu */}
        <div id="mobile-menu" className={`md:hidden bg-[#111827] ${menuOpen ? 'open' : ''} overflow-hidden transition-all`}>
          <div className="flex flex-col space-y-3 px-6 py-4 text-gray-300">
            {links.map(link => <a key={link} href={`#${link.toLowerCase()}`} className="py-1" onClick={() => setMenuOpen(false)}>{link}</a>)}
          </div>
        </div>
      </nav>
    );
  };

  const Hero = () => (
    <section id="home" className="min-h-screen flex items-center pt-20 pb-10 bg-gradient-to-br from-[#0F172A] via-[#1e1a3a] to-[#2d1b48]">
      <div className="max-w-6xl mx-auto px-6 grid md:grid-cols-2 gap-10 items-center">
        <div className="reveal active"> {/* active directly because visible on load */}
          <h1 className="text-5xl md:text-6xl font-extrabold mb-4"><span className="text-white">Masood </span><span className="text-[#4F46E5]">Ahmad</span></h1>
          <p className="text-xl text-gray-300 mb-3">Software Engineering Student | E‑Commerce Specialist</p>
          <p className="text-gray-400 mb-6 max-w-md">Building digital experiences with code & market insight. Amazon seller assistant with a passion for clean products.</p>
          <div className="flex flex-wrap gap-4">
            <button className="bg-[#4F46E5] hover:bg-[#6366f1] text-white px-6 py-3 rounded-2xl font-medium shadow-lg flex items-center gap-2 transition">📄 Download CV</button>
            <button className="border border-[#4F46E5] text-[#4F46E5] hover:bg-[#4F46E5]/10 px-6 py-3 rounded-2xl font-medium transition">✉️ Contact Me</button>
          </div>
        </div>
        <div className="flex justify-center reveal active">
          <div className="w-64 h-64 md:w-80 md:h-80 rounded-full bg-gradient-to-tr from-[#4F46E5] to-[#9333EA] p-1 shadow-2xl">
            <div className="w-full h-full rounded-full bg-[#111827] flex items-center justify-center text-8xl font-light border-4 border-[#0F172A]">👤</div>
          </div>
        </div>
      </div>
    </section>
  );

  const About = () => {
    const details = [
      { icon: '📍', label: LOCATION },
      { icon: '🎓', label: 'BS Software Engineering (GPA: 3.46)' },
      { icon: '📦', label: 'Amazon Seller Experience' },
      { icon: '🗣️', label: 'English (C1) · Urdu (B2)' }
    ];
    return (
      <section id="about" className="py-20 bg-[#0F172A]">
        <div className="max-w-6xl mx-auto px-6">
          <h2 className="text-3xl font-bold mb-12 text-white">About <span className="text-[#4F46E5]">me</span></h2>
          <div className="grid md:grid-cols-2 gap-10">
            <div className="reveal text-gray-300 text-lg leading-relaxed">
              <p>Computer Science student at Superior University, focused on full‑stack development and e‑commerce solutions. 
              I combine software engineering practices with hands-on Amazon marketplace experience to deliver efficient, user‑focused products. 
              I thrive in collaborative environments and constantly explore new tools to build scalable applications.</p>
            </div>
            <div className="reveal grid grid-cols-1 sm:grid-cols-2 gap-5">
              {details.map((item, i) => (
                <div key={i} className="bg-[#111827] p-5 rounded-2xl shadow-lg border border-gray-800 flex items-center gap-4 hover:shadow-[#4F46E5]/20 transition">
                  <span className="text-3xl">{item.icon}</span>
                  <span className="text-gray-200 font-medium">{item.label}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </section>
    );
  };

  const Experience = () => {
    const resp = ['Product hunting and sourcing', 'Product listing management', 'Order management', 'Inventory tracking', 'Customer support'];
    return (
      <section id="experience" className="py-20 bg-[#111827]">
        <div className="max-w-5xl mx-auto px-6">
          <h2 className="text-3xl font-bold mb-12 text-white">experience</h2>
          <div className="relative pl-8 border-l-4 border-[#4F46E5]">
            <div className="reveal timeline-card bg-[#1E293B] p-6 rounded-2xl shadow-xl mb-8 relative">
              <span className="absolute -left-12 top-6 w-8 h-8 bg-[#9333EA] rounded-full border-4 border-[#0F172A]"></span>
              <h3 className="text-xl font-semibold text-white">E‑Commerce Assistant (Amazon Seller)</h3>
              <p className="text-[#4F46E5] mb-2">Lahore, Pakistan · May 2025 – Current</p>
              <ul className="list-disc list-inside text-gray-300 space-y-1">
                {resp.map((r, i) => <li key={i}>{r}</li>)}
              </ul>
            </div>
          </div>
        </div>
      </section>
    );
  };

  const Projects = () => {
    const tech = ['React', 'Node.js', 'MongoDB', 'Tailwind'];
    return (
      <section id="projects" className="py-20 bg-[#0F172A]">
        <div className="max-w-6xl mx-auto px-6">
          <h2 className="text-3xl font-bold mb-12 text-white">projects</h2>
          <div className="grid md:grid-cols-3 gap-8">
            {[1, 2, 3].map((_, idx) => (
              <div key={idx} className="reveal bg-[#111827] rounded-2xl shadow-xl overflow-hidden hover-lift transition duration-300 border border-gray-800">
                <div className="h-40 bg-gradient-to-br from-[#4F46E5]/30 to-[#9333EA]/30 flex items-center justify-center text-6xl text-gray-500">📱</div>
                <div className="p-5">
                  <h3 className="text-xl font-bold text-white">Academic Web & Mobile Apps</h3>
                  <p className="text-gray-400 text-sm mt-2">Built using frontend technologies, basic backend logic, and databases. Applied SDLC, debugging, version control, optimisation.</p>
                  <div className="flex flex-wrap gap-2 mt-4">
                    {tech.map(t => <span key={t} className="px-3 py-1 text-xs rounded-full bg-[#1E293B] text-[#4F46E5] border border-[#4F46E5]/30">{t}</span>)}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>
    );
  };

  const Skills = () => {
    const categories = [
      { title: 'Software Development', items: ['Version Control', 'Debugging', 'Databases', 'SDLC'], icon: '💻' },
      { title: 'E‑Commerce', items: ['Product sourcing', 'Inventory management', 'Customer service', 'Market awareness'], icon: '📦' },
      { title: 'Marketing', items: ['Facebook marketing', 'Customer engagement', 'Project management'], icon: '📈' }
    ];
    return (
      <section id="skills" className="py-20 bg-[#111827]">
        <div className="max-w-6xl mx-auto px-6">
          <h2 className="text-3xl font-bold mb-12 text-white">skills</h2>
          <div className="grid md:grid-cols-3 gap-8">
            {categories.map((cat, i) => (
              <div key={i} className="reveal bg-[#0F172A] p-6 rounded-2xl border border-gray-800 shadow-lg hover:shadow-[#4F46E5]/10 transition">
                <div className="text-4xl mb-3">{cat.icon}</div>
                <h3 className="text-xl font-semibold text-white mb-4">{cat.title}</h3>
                <div className="flex flex-wrap gap-2">
                  {cat.items.map(skill => (
                    <span key={skill} className="px-4 py-2 bg-[#1E293B] rounded-xl text-gray-200 text-sm flex items-center gap-1 hover:scale-105 transition">⚡ {skill}</span>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>
    );
  };

  const Education = () => (
    <section id="education" className="py-20 bg-[#0F172A]">
      <div className="max-w-3xl mx-auto px-6 text-center">
        <h2 className="text-3xl font-bold mb-10 text-white">education</h2>
        <div className="reveal bg-[#111827] p-6 rounded-2xl shadow-xl mb-6 border border-gray-800">
          <h3 className="text-2xl font-semibold text-white">BS Software Engineering</h3>
          <p className="text-[#4F46E5]">Superior University Lahore · 2023 – Current</p>
          <p className="text-gray-400 mt-1">GPA: 3.46</p>
        </div>
        <div className="reveal bg-[#111827] p-6 rounded-2xl shadow-xl border border-gray-800">
          <h3 className="text-2xl font-semibold text-white">FSC Pre‑Engineering</h3>
          <p className="text-[#4F46E5]">Superior College Okara · 2021 – 2023</p>
        </div>
      </div>
    </section>
  );

  const Contact = () => {
    return (
      <section id="contact" className="py-20 bg-[#111827]">
        <div className="max-w-4xl mx-auto px-6">
          <h2 className="text-3xl font-bold mb-12 text-white">contact</h2>
          <div className="grid md:grid-cols-2 gap-10">
            <div className="reveal space-y-5">
              <div className="flex items-center gap-4 text-gray-300 bg-[#0F172A] p-4 rounded-2xl"><span className="text-2xl">📞</span> {PHONE}</div>
              <div className="flex items-center gap-4 text-gray-300 bg-[#0F172A] p-4 rounded-2xl"><span className="text-2xl">✉️</span> {EMAIL}</div>
              <div className="flex items-center gap-4 text-gray-300 bg-[#0F172A] p-4 rounded-2xl"><span className="text-2xl">📍</span> {LOCATION}</div>
            </div>
            <div className="reveal bg-[#0F172A] p-6 rounded-2xl shadow-xl border border-gray-700">
              <input type="text" placeholder="Name" className="w-full p-3 rounded-xl bg-[#1E293B] border border-gray-700 text-white mb-4" />
              <input type="email" placeholder="Email" className="w-full p-3 rounded-xl bg-[#1E293B] border border-gray-700 text-white mb-4" />
              <textarea rows="4" placeholder="Message" className="w-full p-3 rounded-xl bg-[#1E293B] border border-gray-700 text-white mb-4"></textarea>
              <button className="bg-[#4F46E5] hover:bg-[#6366f1] px-6 py-3 rounded-xl text-white font-medium w-full transition">Send message</button>
            </div>
          </div>
        </div>
      </section>
    );
  };

  const Footer = () => (
    <footer className="bg-[#0F172A] border-t border-gray-800 py-8">
      <div className="max-w-6xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center text-gray-400 text-sm">
        <span>© 2025 Masood Ahmad</span>
        <div className="flex space-x-5 my-3 md:my-0">
          <span className="hover:text-white transition cursor-pointer">🐦</span>
          <span className="hover:text-white transition cursor-pointer">💼</span>
          <span className="hover:text-white transition cursor-pointer">📷</span>
          <span className="hover:text-white transition cursor-pointer">🔗</span>
        </div>
        <span>software · e‑commerce</span>
      </div>
    </footer>
  );

  const App = () => (
    <div className="bg-[#0F172A]">
      <NavBar />
      <Hero />
      <About />
      <Experience />
      <Projects />
      <Skills />
      <Education />
      <Contact />
      <Footer />
    </div>
  );

  const container = document.getElementById('root');
  const root = ReactDOM.createRoot(container);
  root.render(<App />);
  
  // re-run lucide icons (optional, but we use emoji so fine)
  if (lucide) lucide.createIcons();
</script>

<!-- ensure reveal elements become active after scroll (Intersection Observer already set) -->
<!-- manual activation for hero is already done by class active -->
</body>
</html>
